[esp]
; WIFI config
ssid = 
pass = 

[pc]
; /sdcard is the root directory of SD card
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin
; try with smaller mem_size/vga_mem_size if it bootloops
mem_size = 7568K
vga_mem_size = 320K
; fdX hdX cdX

; Boot test with floppy image, then switch to hard disk image
boot_drive = a
fda = /sdcard/floppy.img

hda = /sdcard/win95.img
fill_cmos = 1

[display]
; DO NOT EDIT
; width = 480
; height = 320

; For LCD_EK79007
width = 1024
height = 600

[cpu]
gen = 3
fpu = 0
